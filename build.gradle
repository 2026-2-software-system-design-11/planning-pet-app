// 본 구현 빌드(D-108). 결과물은 java -jar로 여는 실행 JAR다.
plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 저장(D-111). 드라이버는 실행 JAR에 넣는다.
    implementation 'org.xerial:sqlite-jdbc:3.54.1.0'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes 'Main-Class': 'planningpet.app.Main'
    }
    // java -jar 하나로 뜨도록 드라이버를 풀어 넣는다(D-111). 드라이버의 module-info와 서명 파일은 넣지 않는다.
    from { configurations.runtimeClasspath.collect { zipTree(it) } }
    exclude 'module-info.class', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

test {
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
    // 임시 진단(#496, 병합하지 않음): 진단 검사의 출력과 실패 메시지를 CI 기록에 보인다. Font.getFont2D를 읽는다.
    testLogging { showStandardStreams = true
        exceptionFormat = 'full' }
    jvmArgs '--add-opens=java.desktop/java.awt=ALL-UNNAMED'
}
